<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Metronic React Starter" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"
    />
    <title>Metronic Starter</title>

    <link
      rel="stylesheet"
      id="layout-styles-anchor"
      href="/splash-screen.css"
    />
  </head>

  <body id="kt_body" class="page-loading">
    <script>
      // Apply the saved theme mode before React mounts (prevents a light/dark flash)
      let themeMode = localStorage.getItem("kt_theme_mode_value") || "light";
      if (themeMode === "system") {
        themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", themeMode);
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
      <img
        src="/media/logos/default-small.svg"
        class="dark-logo"
        alt="Logo"
      />
      <img
        src="/media/logos/default-small.svg"
        class="light-logo"
        alt="Logo"
      />
      <div class="loader-wrapper">
        <span class="loader"></span>
        <span class="loading-text">Loading...</span>
      </div>
    </div>

    <div id="root-modals"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
